[tox]
envlist = py{310,314}, coverage, style, docs

[testenv]
setenv = COVERAGE_FILE={toxworkdir}/.coverage.{envname}
usedevelop = True
dependency_groups = test
commands = pytest {posargs:-vv --cov=src tests}

[testenv:coverage]
setenv = COVERAGE_FILE={toxworkdir}/.coverage
skip_install = True
dependency_groups =
deps = coverage
commands = coverage combine
           coverage report -m
           coverage xml
           coverage html

[testenv:style]
skip_install = True
dependency_groups =
deps = ruff
commands = ruff check
           ruff format --diff

[testenv:docs]
skip_install = True
dependency_groups =
deps = docutils
commands = python -m docutils --strict README.rst {toxworkdir}/README.html

[testenv:reformat]
skip_install = True
dependency_groups =
deps = ruff
commands = ruff check --fix
           ruff format

# Type checkers: one environment each, not gating CI yet
[testenv:basedpyright]
deps = basedpyright
# Without --pythonpath, basedpyright resolves imports against ./.venv rather than this tox env
commands = basedpyright --pythonpath {envpython} {posargs}

[testenv:mypy]
deps = mypy
commands = mypy {posargs}

[testenv:pyrefly]
deps = pyrefly
commands = pyrefly check {posargs}

[testenv:pyright]
deps = pyright
commands = pyright {posargs}

[testenv:ty]
deps = ty
commands = ty check {posargs}

[testenv:zuban]
deps = zuban
# Without --python-executable, zuban doesn't resolve imports against this tox env
commands = zuban check --python-executable {envpython} {posargs}


[coverage:run]
data_file = .tox/.coverage
[coverage:html]
directory = .tox/test-reports/htmlcov
[coverage:xml]
output = .tox/test-reports/coverage.xml
[pytest]
cache_dir = .tox/pytest_cache
